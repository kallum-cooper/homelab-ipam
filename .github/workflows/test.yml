name: Test

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --test src/test/*.test.mjs
      - run: node --check src/enrichment.mjs
      - run: node --check src/unifi.mjs
      - run: node --check src/run.mjs
