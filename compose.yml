services:
  ipam:
    image: ${IPAM_IMAGE:-ghcr.io/kallum-cooper/homelab-ipam:latest}
    pull_policy: always
    container_name: ipam
    restart: unless-stopped
    network_mode: host
    cap_drop:
      - ALL
    cap_add:
      - NET_RAW
    extra_hosts:
      - "unifi.local:192.168.1.1"
    env_file:
      - ${IPAM_ENV_FILE:-./unifi.env}
    environment:
      IPAM_SCAN_ARGS_JSON: '["--localnet"]'
      UNIFI_CA_CERT_PATH: /run/secrets/unifi-ca.pem
    volumes:
      - ipam-data:/data
      - ${IPAM_CA_CERT_FILE:-./unifi-ca.pem}:/run/secrets/unifi-ca.pem:ro

volumes:
  ipam-data:
    name: ipam-data
