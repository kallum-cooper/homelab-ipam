services:
  ipam:
    image: ${IPAM_IMAGE:-ghcr.io/kallum-cooper/homelab-ipam:latest}
    pull_policy: always
    container_name: ipam
    restart: unless-stopped
    network_mode: host
    cap_drop:
      - ALL
    cap_add:
      - NET_RAW
    environment:
      IPAM_SCAN_ARGS_JSON: '["--localnet"]'
    volumes:
      - ipam-data:/data

volumes:
  ipam-data:
    name: ipam-data
