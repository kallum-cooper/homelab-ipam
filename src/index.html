<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Homelab IPAM</title>
  <style>
    :root { color-scheme: dark; font-family: ui-sans-serif, system-ui, sans-serif; }
    * { box-sizing: border-box; }
    body { margin: 0; background: #0b1020; color: #dbe7ff; }
    main { width: min(1100px, calc(100% - 2rem)); margin: 2rem auto; }
    header, .meta { display: flex; align-items: center; justify-content: space-between; gap: 1rem; }
    h1 { margin: 0; font-size: 1.5rem; }
    button { border: 0; border-radius: .45rem; padding: .65rem 1rem; background: #5b8cff; color: #071126; font-weight: 700; cursor: pointer; }
    button:disabled { cursor: wait; opacity: .55; }
    .panel { margin-top: 1rem; overflow: hidden; border: 1px solid #273555; border-radius: .7rem; background: #111a2f; }
    .meta { padding: .8rem 1rem; color: #9db0d3; font-size: .86rem; flex-wrap: wrap; }
    #status[data-error="true"] { color: #ff9b9b; }
    table { width: 100%; border-collapse: collapse; }
    th, td { padding: .75rem 1rem; text-align: left; border-top: 1px solid #273555; }
    th { color: #9db0d3; font-size: .75rem; text-transform: uppercase; letter-spacing: .06em; }
    td { font-family: ui-monospace, SFMono-Regular, Consolas, monospace; font-size: .85rem; }
    .empty { color: #7889aa; }
    @media (max-width: 720px) { .table-wrap { overflow-x: auto; } th, td { padding: .65rem; } }
  </style>
</head>
<body>
  <main>
    <header>
      <h1>Homelab IPAM</h1>
      <button id="scan-button" type="button">Scan now</button>
    </header>
    <section class="panel" aria-live="polite">
      <div class="meta">
        <span id="status">Loading status…</span>
        <span>Last attempt: <time id="last-attempt">Never</time></span>
        <span>Last success: <time id="last-success">Never</time></span>
      </div>
      <div class="table-wrap">
        <table>
          <thead><tr><th>IP address</th><th>Hostname</th><th>MAC</th><th>Last seen</th></tr></thead>
          <tbody id="entries"></tbody>
        </table>
      </div>
    </section>
  </main>
  <script>
    const scanButton = document.querySelector('#scan-button');
    const statusText = document.querySelector('#status');
    const lastAttempt = document.querySelector('#last-attempt');
    const lastSuccess = document.querySelector('#last-success');
    const entriesBody = document.querySelector('#entries');

    function formatTime(value) {
      return value ? new Date(value).toLocaleString() : 'Never';
    }

    function renderEntries(entries) {
      if (entries.length === 0) {
        const row = document.createElement('tr');
        const cell = document.createElement('td');
        cell.colSpan = 4;
        cell.className = 'empty';
        cell.textContent = 'No retained entries';
        row.append(cell);
        entriesBody.replaceChildren(row);
        return;
      }

      const rows = entries.map(entry => {
        const row = document.createElement('tr');
        for (const value of [entry.ip, entry.hostname ?? '—', entry.mac ?? '—', formatTime(entry.lastSeenAt)]) {
          const cell = document.createElement('td');
          cell.textContent = value;
          row.append(cell);
        }
        return row;
      });
      entriesBody.replaceChildren(...rows);
    }

    function render(status) {
      scanButton.disabled = status.scanInProgress;
      statusText.textContent = status.error ?? (status.scanInProgress ? 'Scan running…' : `${status.entries.length} retained`);
      statusText.dataset.error = String(Boolean(status.error));
      lastAttempt.textContent = formatTime(status.lastAttemptAt);
      lastSuccess.textContent = formatTime(status.lastSuccessfulScanAt);
      renderEntries(status.entries);
    }

    async function requestStatus(path, options = {}) {
      const response = await fetch(path, {
        ...options,
        headers: { accept: 'application/json' },
        signal: AbortSignal.timeout(10_000),
      });
      if (!response.ok) throw new Error(`Request failed (${response.status})`);
      return response.json();
    }

    async function refreshStatus() {
      try {
        render(await requestStatus('/api/status'));
      } catch (error) {
        statusText.textContent = error instanceof Error ? error.message : String(error);
        statusText.dataset.error = 'true';
      }
    }

    async function waitForScanCompletion() {
      while (true) {
        try {
          const status = await requestStatus('/api/status');
          render(status);
          if (!status.scanInProgress) return;
        } catch (error) {
          statusText.textContent = error instanceof Error ? error.message : String(error);
          statusText.dataset.error = 'true';
        }
        await new Promise(resolve => setTimeout(resolve, 1_000));
      }
    }

    async function scanNow() {
      scanButton.disabled = true;
      try {
        render(await requestStatus('/api/scan', { method: 'POST' }));
      } catch (error) {
        statusText.textContent = error instanceof Error ? error.message : String(error);
        statusText.dataset.error = 'true';
        await waitForScanCompletion();
      }
    }

    scanButton.addEventListener('click', scanNow);
    refreshStatus();
    setInterval(refreshStatus, 60_000);
  </script>
</body>
</html>
